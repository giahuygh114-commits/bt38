<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game kiểm tra tốc độ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Game kiểm tra tốc độ</h1>
<p class="sub">Click trúng hình tròn càng nhiều càng tốt trong 30 giây.</p>

<div class="info">
  <div>Điểm: <b id="score">0</b></div>
  <div>Thời gian: <b id="time">30</b>s</div>
</div>

<div class="wrap">
  <div id="arena">
    <button id="target" aria-label="Mục tiêu"></button>
    <div id="overlay" aria-live="polite">
      <span>Hết giờ! Tổng điểm của bạn</span>
      <strong id="finalScore">0</strong>
    </div>
  </div>
</div>

<button id="startBtn">Bắt đầu trò chơi</button>

<script src="script.js"></script>
</body>
</html>
